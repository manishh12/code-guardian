services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: code-guardian-db
    environment:
      POSTGRES_USER: guardian
      POSTGRES_PASSWORD: guardian
      POSTGRES_DB: code_guardian
    ports:
      - "5432:5432"
    volumes:
      - guardian_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guardian -d code_guardian"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: code-guardian-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: "8787"
      DATABASE_URL: postgres://guardian:guardian@postgres:5432/code_guardian
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-20b}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-change-me}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    ports:
      - "8787:8787"
    working_dir: /app
    command: ["/bin/sh", "-c", "/app/seed && /app/server"]

volumes:
  guardian_pg:
